<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="34%" cy="24%" r="86%">
      <stop offset="0%" stop-color="#1b3a48"/>
      <stop offset="52%" stop-color="#0d1a24"/>
      <stop offset="100%" stop-color="#05080c"/>
    </radialGradient>
    <linearGradient id="tre" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffe97a"/>
      <stop offset="55%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ffa91a"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip"><circle cx="256" cy="256" r="248"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="106" fill="#05080c"/>
  <circle cx="256" cy="256" r="248" fill="url(#bg)"/>

  <!-- globe graticule -->
  <g clip-path="url(#clip)" stroke="#2c5566" stroke-width="2.4" fill="none" opacity=".62">
    <circle cx="256" cy="256" r="248"/>
    <line x1="8" y1="256" x2="504" y2="256"/>
    <ellipse cx="256" cy="256" rx="248" ry="150"/>
    <ellipse cx="256" cy="256" rx="248" ry="62"/>
    <ellipse cx="256" cy="256" rx="150" ry="248"/>
    <ellipse cx="256" cy="256" rx="62" ry="248"/>
  </g>

  <!-- radiation trefoil -->
  <g filter="url(#glow)">
    <g fill="url(#tre)" transform="translate(256 256)">
      <g id="blade">
        <path d="M -75 -129.9 A 150 150 0 0 1 75 -129.9 L 39 -67.55 A 78 78 0 0 0 -39 -67.55 Z"/>
      </g>
      <g transform="rotate(120)"><path d="M -75 -129.9 A 150 150 0 0 1 75 -129.9 L 39 -67.55 A 78 78 0 0 0 -39 -67.55 Z"/></g>
      <g transform="rotate(240)"><path d="M -75 -129.9 A 150 150 0 0 1 75 -129.9 L 39 -67.55 A 78 78 0 0 0 -39 -67.55 Z"/></g>
      <circle cx="0" cy="0" r="36"/>
    </g>
  </g>
</svg>
